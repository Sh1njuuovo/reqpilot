name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Run tests
        run: uv run pytest --cov=reqpilot --cov-report=term-missing
      - name: Run LLM smoke
        if: env.DEEPSEEK_API_KEY != ''
        run: uv run reqpilot smoke
      - name: Run LLM eval
        if: env.DEEPSEEK_API_KEY != ''
        run: uv run reqpilot eval
      - name: Run sandboxed agent loop
        if: env.DEEPSEEK_API_KEY != ''
        run: |
          uv run reqpilot demo
          uv run reqpilot agent --workspace reports/demo

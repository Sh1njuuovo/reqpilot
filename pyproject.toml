[project]
name = "reqpilot"
version = "0.1.0"
description = "ReqPilot: a domain-aware requirements engineering agent that turns natural-language requirements into structured PRDs, multi-role review reports, interactive prototypes, and development tasks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shinjuu" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "langgraph>=0.2",
  "httpx>=0.27",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]
vector = [
  "sentence-transformers>=3",
  "numpy>=1.26",
]

[project.scripts]
reqpilot = "reqpilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reqpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
source = ["reqpilot"]
omit = ["src/reqpilot/mcp_server.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
